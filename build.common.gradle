android {
    compileSdk 34
    packagingOptions {
        jniLibs.useLegacyPackaging true
    }

    signingConfigs {
        release {
            def apkStoreFile = System.getenv("APK_SIGNING_STORE_FILE")
            if (apkStoreFile != null) {
                keyAlias System.getenv("APK_SIGNING_KEY_ALIAS")
                keyPassword System.getenv("APK_SIGNING_KEY_PASSWORD")
                storeFile file(System.getenv("APK_SIGNING_STORE_FILE"))
                storePassword System.getenv("APK_SIGNING_STORE_PASSWORD")
            } else {
                keyAlias 'androiddebugkey'
                keyPassword 'android'
                storeFile rootProject.file('libs/ftc.debug.keystore')
                storePassword 'android'
            }
        }

        debug {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile rootProject.file('libs/ftc.debug.keystore')
            storePassword 'android'
        }
    }

    defaultConfig {
        signingConfig signingConfigs.debug
        minSdkVersion 24
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"
    }
}

dependencies {
    //noinspection Aligned16KB
    compileOnly 'org.firstinspires.ftc:RobotCore:12.0.0'
    compileOnly 'org.firstinspires.ftc:Hardware:12.0.0'
    compileOnly 'org.firstinspires.ftc:FtcCommon:12.0.0'

    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    // (Required) Writing and executing Unit Tests on the JUnit Platform
    testImplementation "org.junit.jupiter:junit-jupiter-api:6.1.3"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:6.1.3"

    // (Optional) If you need "Parameterized Tests"
    testImplementation "org.junit.jupiter:junit-jupiter-params:6.1.3"

    androidTestAnnotationProcessor 'org.projectlombok:lombok:1.18.48'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'com.google.guava:guava-testlib:33.8.0-android'

    //noinspection Aligned16KB
    testImplementation 'org.firstinspires.ftc:RobotCore:12.0.0'
    testImplementation 'org.firstinspires.ftc:Hardware:12.0.0'

    api 'com.google.guava:guava:33.8.0-android'
}

project.gradle.startParameter.excludedTaskNames.add('installDebugAndroidTest')
project.gradle.startParameter.excludedTaskNames.add('androidJavadocs')